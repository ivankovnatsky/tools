[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchd-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
launchd-mgmt = "launchd_mgmt:cli"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"launchd-mgmt.py" = "launchd_mgmt.py"
