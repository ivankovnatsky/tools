[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nextdns-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "dnspython",
    "requests",
]

[project.scripts]
nextdns-mgmt = "nextdns_mgmt:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"nextdns-mgmt.py" = "nextdns_mgmt.py"
