[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nix-find-orphans"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
nix-find-orphans = "nix_find_orphans:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"nix-find-orphans.py" = "nix_find_orphans.py"
