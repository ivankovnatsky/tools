[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpg-pass"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
gpg-pass = "gpg_pass:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"gpg-pass.py" = "gpg_pass.py"
