[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arr-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "requests",
]

[project.scripts]
arr-mgmt = "arr_mgmt:cli"

[tool.hatch.build.targets.wheel]
only-include = [
    "clients.py",
    "sync.py",
]

[tool.hatch.build.targets.wheel.force-include]
"arr-mgmt.py" = "arr_mgmt.py"
