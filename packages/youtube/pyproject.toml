[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "requests",
]

[project.scripts]
youtube = "youtube:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "auth.py",
    "cli.py",
    "client.py",
    "commands.py",
    "constants.py",
    "display.py",
    "youtube.py",
]
