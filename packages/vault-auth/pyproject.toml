[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vault-auth"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
vault-auth = "vault_auth:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"vault-auth.py" = "vault_auth.py"
