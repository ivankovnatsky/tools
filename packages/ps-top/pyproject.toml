[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ps-top"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psutil",
]

[project.scripts]
ps-top = "ps_top:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"ps-top.py" = "ps_top.py"
