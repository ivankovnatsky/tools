[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-pr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
gh-pr = "gh_pr:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"gh-pr.py" = "gh_pr.py"
