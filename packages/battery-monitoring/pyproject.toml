[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-monitoring"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiofiles",
    "aiohttp",
    "click",
    "cryptography",
    "discord-webhook",
    "paho-mqtt",
    "python-dotenv",
    "anker-solix-api @ git+https://github.com/thomluther/anker-solix-api@c2f87696f49151d8ead790b744bc6970e6258c2c",
]

[project.scripts]
battery-monitoring = "battery_monitoring:cli"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = [
    "dashboard.html",
]

[tool.hatch.build.targets.wheel.force-include]
"battery-monitoring.py" = "battery_monitoring.py"
"../discord/discord.py" = "discord.py"
"../discord/digest.py" = "digest.py"
