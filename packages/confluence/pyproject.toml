[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confluence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "atlassian-python-api",
    "click",
    "markdown",
]

[project.scripts]
confluence = "confluence:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "confluence.py",
]
