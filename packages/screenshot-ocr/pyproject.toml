[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "screenshot-ocr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
screenshot-ocr = "screenshot_ocr:run"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"screenshot-ocr.py" = "screenshot_ocr.py"
