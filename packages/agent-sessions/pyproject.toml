[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-sessions"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-sessions = "agent_sessions:run"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"agent-sessions.py" = "agent_sessions.py"
