[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-export"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
music-export = "music_export:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"music-export.py" = "music_export.py"
