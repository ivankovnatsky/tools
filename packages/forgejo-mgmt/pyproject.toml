[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgejo-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "requests",
]

[project.scripts]
forgejo-mgmt = "forgejo_mgmt:cli"

[tool.hatch.build.targets.wheel]
only-include = [
    "auth.py",
    "client.py",
    "utils.py",
]

[tool.hatch.build.targets.wheel.force-include]
"forgejo-mgmt.py" = "forgejo_mgmt.py"
