[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-restore"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
git-restore = "git_restore:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"git-restore.py" = "git_restore.py"
