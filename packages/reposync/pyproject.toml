[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reposync"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "discord-webhook",
]

[project.scripts]
reposync = "reposync:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "alerting.py",
    "bundle.py",
    "cli.py",
    "config.py",
    "git_ops.py",
    "repo.py",
    "reposync.py",
]

[tool.hatch.build.targets.wheel.force-include]
"../discord/discord.py" = "discord.py"
"../discord/digest.py" = "digest.py"
