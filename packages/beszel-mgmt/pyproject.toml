[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beszel-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "requests",
]

[project.scripts]
beszel-mgmt = "beszel_mgmt:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "auth.py",
    "cli.py",
    "client.py",
    "commands.py",
    "constants.py",
]

[tool.hatch.build.targets.wheel.force-include]
"beszel-mgmt.py" = "beszel_mgmt.py"
