[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jellyfin-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "requests",
]

[project.scripts]
jellyfin-mgmt = "jellyfin_mgmt:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "client.py",
    "commands.py",
    "sync.py",
]

[tool.hatch.build.targets.wheel.force-include]
"jellyfin-mgmt.py" = "jellyfin_mgmt.py"
