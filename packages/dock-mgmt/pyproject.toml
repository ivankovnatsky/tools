[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dock-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dock-mgmt = "dock_mgmt:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"dock-mgmt.py" = "dock_mgmt.py"
