[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asusrouter-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asusrouter",
    "click",
]

[project.scripts]
asusrouter-cli = "asusrouter_cli:main"

[tool.hatch.build.targets.wheel]
only-include = [
    "client.py",
    "commands.py",
    "nvram_groups.py",
]

[tool.hatch.build.targets.wheel.force-include]
"asusrouter-cli.py" = "asusrouter_cli.py"
