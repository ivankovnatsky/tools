[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k8s-context"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "pyyaml",
]

[project.scripts]
k8s-context = "k8s_context:cli"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"k8s-context.py" = "k8s_context.py"
