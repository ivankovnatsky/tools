[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "syncthing-mgmt"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bcrypt",
    "click",
    "requests",
    "rich",
]

[project.scripts]
syncthing-mgmt = "syncthing_mgmt:cli"

[tool.hatch.build.targets.wheel]
only-include = [
    "client.py",
    "commands.py",
    "display.py",
    "sync.py",
    "utils.py",
]

[tool.hatch.build.targets.wheel.force-include]
"syncthing-mgmt.py" = "syncthing_mgmt.py"
