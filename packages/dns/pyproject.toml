[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dns"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
dns = "dns_cli:run"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"dns.py" = "dns_cli.py"
