[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nix-sort-imports"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
nix-sort-imports = "nix_sort_imports:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"nix-sort-imports.py" = "nix_sort_imports.py"
