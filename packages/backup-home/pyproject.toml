[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backup-home"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
]

[project.scripts]
backup-home = "backup_home:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"backup-home.py" = "backup_home.py"
