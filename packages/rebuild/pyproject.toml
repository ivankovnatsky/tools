[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rebuild"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "click",
    "discord-webhook",
    "pywatchman",
]

[project.scripts]
rebuild = "rebuild:cli"

[tool.hatch.build.targets.wheel]
only-include = [
    "cli.py",
    "lock.py",
    "machines.py",
    "notify.py",
    "runner.py",
    "util.py",
    "watchman.py",
]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "rebuild.py"
"../discord/discord.py" = "discord.py"
"../discord/digest.py" = "digest.py"
