# Sample tools config (YAML).
#
# `tools --config path/to/file.yaml` loads a single file.
# `tools --config path/to/dir/`       loads every supported file in the
#                                     directory (lexicographic order,
#                                     deep-merged: scalars replace,
#                                     dicts recurse, lists replace).
#
# Supported formats in a config directory: .json, .yaml, .yml, .toml.

stateFile: ~/.local/state/tools/state.json

# Placeholders: see README "Vars and placeholders".
vars:
  dataDir: ~/.local/share
  appDir: ${dataDir}/example-app

# The keys the reconcilers actually read. bun and npm index theirs directly,
# so a section is only safe to enable once its keys are present.
#
#   bun       directory containing the `bun` binary       (bun)
#   bunBin    where `bun install -g` puts binaries        (bun)
#   nodejs    directory containing `node` and `npm`       (bun, npm, mcp)
#   npmBin    where `npm install -g` puts binaries        (npm, mcp)
#   uv        directory containing the `uv` binary        (uv)
#   uvBin     where `uv tool install` puts binaries       (uv)
#   uvToolDir uv's tool root                              (uv)
#   goBin     $GOBIN for `go install`                     (go)
#   goPath    $GOPATH for `go install`                    (go)
#   cargoHome $CARGO_HOME for `cargo install`             (cargo)
#   cargoRoot $CARGO_INSTALL_ROOT for `cargo install`     (cargo)
#   python    directory containing `python`               (mcp)
#   claudeCli full path to the `claude` binary            (mcp)
paths:
  bun: ~/.bun/bin
  bunBin: ~/.bun/bin
  nodejs: /usr/bin
  npmBin: ~/.npm/bin
  uv: /usr/bin
  uvBin: ~/.local/bin
  uvToolDir: ~/.local/share/uv/tools
  goBin: ~/.go/bin
  goPath: ~/.go
  cargoHome: ~/.cargo
  python: /usr/bin
  claudeCli: ~/.local/bin/claude

bun:
  packages: {}

npm:
  packages: {}

uv:
  packages: {}

# Go packages are installed with `go install <module>@<version>`.
# `paths.goBin`/`paths.goPath` above are propagated to `go install`
# as $GOBIN / $GOPATH so binaries land where we tell them. If both
# are omitted, tools falls back to `go env GOBIN`/`go env GOPATH/bin`.
go:
  packages: {}

# Cargo crates are installed with `cargo install <crate> [--version <v>]`
# (`--git <source> --rev <commit>` with a commit pin). `paths.cargoHome`/
# `paths.cargoRoot` above are propagated as $CARGO_HOME /
# $CARGO_INSTALL_ROOT; binaries land in `<root>/bin`, the root defaulting to
# cargoHome, then $CARGO_INSTALL_ROOT, $CARGO_HOME, `~/.cargo`.
cargo:
  packages: {}

# Pi packages are installed with `pi install <source>`.
# Reconciled via the `pi` CLI.
pi:
  packages: {}

mcp:
  servers: {}
  # example:
  #   servers:
  #     search:
  #       scope: user
  #       transport: http
  #       url: https://mcp.example.test/
  #       headers: ["Authorization: Bearer ${API_KEY}"] # expanded by claude, not tools

curlShell: {}
  # example (uninstall runs when the entry is dropped; see README "curlShell"):
  #   https://example.test/install.sh: bash
  #   https://example.test/other.sh:
  #     shell: bash
  #     uninstall: rm -rf ~/.other

gitRepos: {}

# Agent Skills (dirs with SKILL.md) from git repos or local dirs, copied to
# each target as <target>/<name>/ and symlinked into each linkTarget. See
# README "Skills" for the full shape.
skills:
  sources:
    anthropic:
      url: https://github.com/anthropics/skills
      subdir: skills
  targets:
    - ~/.agents/skills
  linkTargets:
    - ~/.claude/skills
  enable: []

# sops-nix style secrets. See README "Sops".
sops:
  age:
    keyFile: ~/.config/sops/age/keys.txt
  defaultSopsFile: secrets/example.yaml # relative to this config dir
  secrets:
    externalDomain: {} # key defaults to the name
    app/password:
      restartUnits: [launchd:com.example.web] # kickstarted when rewritten
    example-jwt:
      generate: { length: 64, charset: alnum }

# sops-nix style templates. See README "Templates".
templates:
  example-app-settings:
    path: ${appDir}/settings.json # default <secretsDir>/rendered/<name>
    format: json # raw (default) | yaml | json | toml | ini | env
    content:
      port: 8080
      domain: app.${sops:externalDomain}
      password: ${sops:app/password}
      jwtFile: ${sopsPath:example-jwt}
    restartUnits: [launchd:com.example.web] # kickstarted when rewritten
  example-app-env:
    path: ${appDir}/app.env
    format: env
    content:
      LOG_LEVEL: info

# Symlinks: target is the link, source is what it points at; `~` and $VARS
# expand. See README "Links".
links: []
# - source: $HOME/.agents/skills/jira
#   target: ~/.claude/skills/jira

# Copies relative to the first --config path. onChange runs when the entry
# changed; onUpdate only on `deploy --update`. A differing file tools did not
# write (or that changed since) is renamed to <target>.tools first. See README.
files: []
# - dir: dotfiles
# - source: dotfiles/.config/nvim/lua/config/pack.lua
#   target: ~/.config/nvim/lua/config/pack.lua
#   onChange: nvim --headless +qa
#   onUpdate: nvim --headless "+lua vim.pack.update(nil, { force = true })" +qa
# - source: etc/shells            # root-owned, outside ~: `sudo tools deploy`
#   target: /etc/shells
#   mode: "0644"

# Downloads from https URLs (README "fetch"). `install` builds the target from
# the verified download: $src (file), $tmp (empty cwd), $out (create it).
fetch: {}
#   ~/.config/nvim/spell/uk.utf-8.spl: https://ftp.nluug.nl/vim/runtime/spell/uk.utf-8.spl
#   ~/.local/bin/tool:
#     url: https://example.com/tool_darwin_arm64.tar.gz
#     sha256: <hex>
#     install: |
#       tar -xzf "$src"
#       mv tool "$out"
#     restartUnits: [launchd:com.example.tool]

# `packages` may also be a dict of {app_id: {remote: ...}} to pin an
# app to one remote when several carry the same ID.
flatpak:
  remotes: {}
  packages: []

# macOS launchd jobs, like nix-config's local.launchd. See README "launchd".
# `tools deploy` manages agents; daemons need `sudo "$(command -v tools)" deploy`.
launchd:
  labelPrefix: com.example
  agents:
    web:
      waitForPaths: [/Volumes/Storage]
      dataDir: /Volumes/Storage/Data/.web
      environment:
        PORT: "8080"
      command: /opt/homebrew/bin/web-server --data /Volumes/Storage/Data/.web
      restartOn: [~/.config/web/config.toml]
    cleanup:
      command: /usr/bin/find /tmp/web -mtime +7 -delete
      startCalendarInterval: { hour: 4, minute: 30 }
      keepAlive: false # default true, as in nix-config
  daemons: {}

# macOS preferences. See README "Defaults".
defaults:
  user:
    NSGlobalDomain:
      AppleKeyboardUIMode: 3
      KeyRepeat: 2
    com.apple.dock:
      tilesize: 64
      autohide-delay: 0.0
    com.apple.HIToolbox:
      AppleEnabledInputSources:
        - InputSourceKind: Keyboard Layout
          KeyboardLayout ID: 252
          KeyboardLayout Name: ABC
    ~/Library/Preferences/ByHost/com.apple.controlcenter:
      Weather: 2
  system: {} # applied only by `sudo tools deploy --scope defaults`

# Permissions, login items and host settings via settingsctl. See README
# "settingsctl". Host settings apply only under `sudo tools deploy`.
settingsctl:
  loginItems: [Hammerspoon]
  defaultBrowser: safari
  hostName: example-mac
  localHostName: example-mac
  timeZone: Europe/Uzhgorod
  sleep: { computer: never, display: 10, disk: never }
  remoteLogin: true

# Keys inside app-owned plists. See README "plist".
plist:
  ~/Library/Application Support/com.nuebling.mac-mouse-fix/config.plist:
    General:showMenuBarItem: false

# Dock layout. See README "Dock". Undeclared sections are left alone.
dock:
  apps:
    - /System/Applications/Mail.app
    - /Applications/Safari.app
    - spacer
    - /System/Applications/System Settings.app
  others:
    - path: ~/Downloads
      view: grid
      display: stack
      sort: dateadded

# Service settings over HTTP APIs. See README "mgmt". Every *File is a
# path (e.g. a sops-decrypted secret); inline secrets are rejected. Each
# service also takes timeout / retries / retryDelay.
mgmt:
  arr:
    radarr: # sonarr and lidarr take the same keys
      baseUrl: http://127.0.0.1:7878
      apiKeyFile: /run/secrets/radarr-api-key
      bindAddress: "*"
      downloadClients:
        - name: Transmission
          host: 127.0.0.1
          port: 9091
          urlBase: /transmission/
          usernameFile: /run/secrets/transmission-username
          passwordFile: /run/secrets/transmission-password
          category: radarr
      rootFolders: [/media/movies] # authoritative when present
    prowlarr:
      baseUrl: http://127.0.0.1:9696
      apiKeyFile: /run/secrets/prowlarr-api-key
      bindAddress: "*"
      indexers: # authoritative when present
        - { name: EZTV, definitionName: eztv, priority: 25 }
      applications: # authoritative when present
        - name: Radarr
          baseUrl: http://127.0.0.1:7878
          apiKeyFile: /run/secrets/radarr-api-key
          prowlarrUrl: http://127.0.0.1:9696
          syncLevel: fullSync
          syncCategories: [2000, 2040, 2045]

  beszel:
    baseUrl: https://beszel.@DOMAIN@
    baseUrlFiles: { DOMAIN: /run/secrets/external-domain }
    emailFile: /run/secrets/beszel-email
    passwordFile: /run/secrets/beszel-password
    discordWebhookFile: /run/secrets/discord-webhook-beszel
    userSettings: { chartTime: 12h }
    systems: # authoritative when present
      - { name: server, host: 127.0.0.1, port: "45876" }

  forgejo:
    baseUrl: http://127.0.0.1:3300
    forgejoBin: /opt/homebrew/bin/forgejo
    configFile: /srv/forgejo/app.ini
    workPath: /srv/forgejo
    tokenFile: /srv/forgejo/mgmt-token # admin API token cache (0600)
    users:
      - usernameFile: /run/secrets/forgejo-admin-name
        admin: true
        emailFile: /run/secrets/forgejo-admin-email
        passwordFile: /run/secrets/forgejo-admin-password
      - username: alice
        emailFile: /run/secrets/forgejo-alice-email
        passwordFile: /run/secrets/forgejo-alice-password
        gpgKeyFile: /run/secrets/forgejo-alice-gpg
    repositories:
      - { name: notes, owner: alice, private: true }

  jellyfin:
    baseUrl: http://127.0.0.1:8096
    apiKeyFile: /run/secrets/jellyfin-api-key
    bindAddress: 0.0.0.0
    libraries:
      - name: Movies
        type: movies
        paths: [/media/movies]
        enableRealtimeMonitor: true
        automaticRefreshIntervalDays: 7

  nextdns:
    profiles:
      home:
        profileFile: nextdns/profile.json # relative to the first --config path
        apiKeyFile: /run/secrets/nextdns-api-key
        profileIdFile: /run/secrets/nextdns-profile-home # else <profileIdDir>/nextdns-profile-<name>, then by name
        vars: { serverIp: 192.0.2.10 } # @serverIp@ in profileFile
        varsFiles: { domain: /run/secrets/external-domain }

  syncthing:
    baseUrl: http://127.0.0.1:8384
    configDir: ~/Library/Application Support/Syncthing # or apiKeyFile
    localDeviceName: server
    gui:
      usernameFile: /run/secrets/syncthing-gui-username
      passwordFile: /run/secrets/syncthing-gui-password # plain or bcrypt
    deviceDefinitionsFile: /run/secrets/syncthing-devices.json # {name: id}
    devices: [server, laptop]
    folders: # authoritative when present
      notes-id:
        path: ~/Notes
        label: Notes
        devices: [server, laptop]
        ignorePatterns: [.git]
    restart: false
