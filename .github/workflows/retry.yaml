name: Retry

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-failed:
    # run_attempt starts at 1, so this allows up to 2 automatic re-runs.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-26.04
    steps:
      - run: gh run rerun "$RUN_ID" --failed --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
